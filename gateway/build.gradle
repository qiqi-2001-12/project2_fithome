apply plugin: 'com.android.library'


android {

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    namespace 'com.hwellyi.smarthome'

    signingConfigs {
        winoble {
            keyAlias 'winoble_gateway'
            keyPassword 'Yunbo168'
            storeFile file('hwellyi.jks')
            storePassword 'Yunbo168'
        }
    }
    compileSdkVersion 28
    defaultConfig {
//        applicationId "com.hwellyi.smarthome"
        minSdkVersion 21
        targetSdkVersion 28
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters 'armeabi-v7a'
            }
        }
//        ndk {
//            ldLibs "log"
//            //abiFilters "armeabi-v7a"
//        }
        signingConfig signingConfigs.winoble
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.winoble
            externalNativeBuild {
                cmake
                        {
                            cppFlags += "-DRELEASE"
                        }
            }
        }
        debug {
            signingConfig signingConfigs.winoble
            jniDebuggable true
            externalNativeBuild {
                cmake
                        {
                            cppFlags += "-DDEBUG"
                        }
            }
        }
    }


    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libCWinobleLib.so'
        pickFirst 'lib/armeabi-v7a/libprotobuf_lite.so'
        pickFirst 'lib/armeabi-v7a/libsqlite3.so'
        pickFirst 'lib/armeabi/libCWinobleLib.so'

    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
//    productFlavors {
//    }

    splits{
        abi {
            enable true
            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for x86, armeabi-v7a, and mips.
            reset()
            // Specifies a list of ABIs that Gradle should create APKs for.
            include  "armeabi-v7a"

        }
    }
    ndkVersion '21.3.6528147'
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
configurations.all {
    resolutionStrategy {
        force 'com.android.support:support-v4:27.1.0'
    }}
dependencies {
   // implementation 'com.android.support:support-v4:26.1.0'
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    implementation 'org.greenrobot:eventbus:3.0.0'
    implementation 'com.github.bumptech.glide:glide:3.8.0'

//    annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.0.1'
}